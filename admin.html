<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <link rel="stylesheet"
  href="styles/admin.css">
</head>
<body>

<div class="admin-container">

  <h1>Fife Beauty Hub Admin</h1>

  <form id="productForm">

    <input type="text"
    id="productName"
    placeholder="Product Name" required>

    <input type="text"
    id="productPrice"
    placeholder="Product Price" required>

    <input type="text"
    id="productImage"
    placeholder="Image URL" required>

    <button type="submit">
      Upload Product
    </button>

  </form>

  <div id="adminProducts"></div>

</div>

<script src="scripts/admin.js"></script>

</body>
</html>
